[Log]
XEnable = true
XDebug = true

[LevelDB]
Path = "data/.cache"

[NetworkMonitor]
Enable = true
CheckInterval = 60
FailCheckInterval = 30
CheckTimeout = 5
TestHosts = ["8.8.8.8", "114.114.114.114", "www.baidu.com"]
FailThreshold = 2
FailHostThreshold = 2
MaxRestarts = 3
RestartWindow = 24
CooldownPeriod = 10
